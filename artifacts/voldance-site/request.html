<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Замовлення треку — VOL DANCE</title>
  <link rel="icon" href="./icon.svg">
  <link rel="stylesheet" href="https://globalic.stream:1140/media/static/css/request_track_widget/request_widget.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,600;0,800;1,800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #fff;
      font-family: Montserrat, sans-serif;
      background:
        radial-gradient(70rem 40rem at 12% -18%, rgba(255,85,0,.18), transparent 58%),
        radial-gradient(50rem 36rem at 92% -8%, rgba(0,210,255,.12), transparent 55%),
        #101014;
    }
    .page-head, .lead, .widget-box { width: 100%; max-width: 900px; }
    .page-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-style: italic; letter-spacing: .08em; }
    .brand .dot { width: 10px; height: 10px; border-radius: 99px; background: #ff5500; box-shadow: 0 0 12px rgba(255,85,0,.8); animation: pulse 1.6s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: .35; } }
    .back {
      color: #cbd5e1; text-decoration: none; font-size: 13px; font-weight: 600;
      border: 1px solid rgba(255,255,255,.14); border-radius: 999px; padding: 7px 14px;
    }
    .back:hover { color: #fff; border-color: rgba(255,85,0,.6); background: rgba(255,85,0,.08); }
    .lead { margin: 0 0 16px; }
    .lead h1 { margin: 0 0 6px; font-size: 22px; }
    .lead p { margin: 0; color: #8b8b9e; font-size: 14px; line-height: 1.5; }
    .widget-box {
      background: #1c1c24; padding: 25px; border-radius: 16px;
      border: 1px solid #ff5500; box-shadow: 0 0 25px rgba(255,85,0,.3);
    }
    .sc-track-request-widget button, [is="track-request-widget"] button {
      background: linear-gradient(135deg, #ff5500 0%, #ffaa00 100%) !important;
      border: none !important; border-radius: 8px !important; color: #fff !important; font-weight: 700 !important;
    }
  </style>
</head>
<body>
  <div class="page-head">
    <div class="brand"><span class="dot"></span> VOL DANCE RADIO</div>
    <a class="back" href="./index.html">← На головну</a>
  </div>
  <div class="lead">
    <h1>Замовлення треку</h1>
    <p>Оберіть трек зі списку та надішліть заявку — вона автоматично потрапляє в чергу ефіру.</p>
  </div>
  <div class="widget-box">
    <div class="sc-track-request-widget">
      <div is="track-request-widget"
        lang="ru"
        api-base="https://globalic.stream:1140/api/v2"
        server-id="1"
        ip-timeout="0" track-timeout="0"
        bgcolor="#1c1c24" bgopacity="1"
        tracks_num="20" track_width="180"
        track_image_default="https://globalic.stream:1140/media/tracks/default_track_img.png"
        meta_font_size="14" meta_font_style="normal" meta_font_color="#ffffff" meta_opacity="1"
        button_color="#FF5500" button_color_active="#00D2FF" button_font_color="#ffffff" button_font_size="14"
        ordering="1" allow_person_and_message="true"
        modal_background_color="#1c1c24" modal_font_color="#ffffff" modal_background_opacity="0.95"
      ></div>
    </div>
  </div>
  <script src="https://globalic.stream:1140/media/static/js/request_track_widget/request_widget.js"></script>
</body>
</html>
