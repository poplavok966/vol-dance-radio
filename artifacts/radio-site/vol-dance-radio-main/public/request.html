<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Замовлення треку — VOL DANCE</title>
  <link rel="stylesheet" type="text/css" href="https://globalic.stream:1140/media/static/css/request_track_widget/request_widget.css" />
  <style>
    * { box-sizing: border-box; }
    body {
      background:
        radial-gradient(1200px 600px at 20% -10%, rgba(255, 59, 0, 0.12), transparent 60%),
        radial-gradient(900px 500px at 90% 0%, rgba(0, 210, 255, 0.10), transparent 55%),
        #0b0d12;
      color: #ffffff;
      font-family: 'Segoe UI', Arial, sans-serif;
      margin: 0; padding: 24px;
      display: flex; flex-direction: column; align-items: center;
      min-height: 100vh;
    }
    .page-head {
      width: 100%; max-width: 900px;
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 18px; gap: 12px; flex-wrap: wrap;
    }
    .brand {
      display: flex; align-items: center; gap: 10px;
      font-weight: 800; letter-spacing: 0.08em; font-size: 15px;
    }
    .brand .dot {
      width: 10px; height: 10px; border-radius: 999px;
      background: #FF3B00; box-shadow: 0 0 12px rgba(255, 59, 0, 0.8);
      animation: pulse 1.6s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }
    .back {
      color: #cbd5e1; text-decoration: none; font-size: 13px;
      border: 1px solid rgba(255,255,255,0.14); border-radius: 999px;
      padding: 7px 14px; transition: all .15s ease;
    }
    .back:hover { color: #fff; border-color: rgba(255,59,0,0.6); background: rgba(255,59,0,0.08); }
    .lead {
      width: 100%; max-width: 900px; margin: 0 0 16px;
    }
    .lead h1 { margin: 0 0 6px; font-size: 22px; font-weight: 800; }
    .lead p { margin: 0; color: #9aa4b2; font-size: 14px; line-height: 1.5; }
    .widget-box {
      background-color: #161B22;
      padding: 25px;
      border-radius: 16px;
      border: 1px solid #FF3B00;
      box-shadow: 0 0 25px rgba(255, 59, 0, 0.3);
      max-width: 900px; width: 100%;
    }
    .sc-track-request-widget button, [is="track-request-widget"] button {
      background: linear-gradient(135deg, #FF3B00 0%, #FF8C00 100%) !important;
      border: none !important; border-radius: 8px !important;
      color: #ffffff !important; font-weight: bold !important;
      padding: 8px 16px !important; cursor: pointer !important;
    }
    .sc-track-request-widget .modal-content, [is="track-request-widget"] .modal-content {
      background-color: #161B22 !important; border: 1px solid #FF3B00 !important;
      border-radius: 12px !important; color: #ffffff !important;
    }
    .sc-track-request-widget input, .sc-track-request-widget textarea,
    [is="track-request-widget"] input, [is="track-request-widget"] textarea {
      background-color: #0B0D12 !important; border: 1px solid rgba(255, 255, 255, 0.2) !important;
      color: #ffffff !important; border-radius: 6px !important; padding: 8px !important;
    }
  </style>
</head>
<body>

  <div class="page-head">
    <div class="brand"><span class="dot"></span> VOL DANCE RADIO</div>
    <a class="back" href="/">← На головну</a>
  </div>

  <div class="lead">
    <h1>Замовлення треку</h1>
    <p>Оберіть трек зі списку та надішліть заявку — вона автоматично потрапляє в чергу ефіру миттєво.</p>
  </div>

  <div class="widget-box">
    <div class="sc-track-request-widget">
      <div is="track-request-widget" 
        lang="ru" 
        api-base="https://globalic.stream:1140/api/v2" 
        server-id="1" 
        ip-timeout="0" track-timeout="0"
        bgcolor="#161B22" bgopacity="1"
        tracks_num="20" track_width="180"
        track_image_default="https://globalic.stream:1140/media/tracks/default_track_img.png"
        meta_font_size="14" meta_font_style="normal" meta_font_color="#ffffff" meta_opacity="1"
        button_color="#FF3B00" button_color_active="#00D2FF" button_font_color="#ffffff" button_font_size="14"
        ordering="1" allow_person_and_message="true"
        modal_background_color="#161B22" modal_font_color="#ffffff" modal_background_opacity="0.95"
      ></div>
    </div>
  </div>

  <script type="text/javascript" src="https://globalic.stream:1140/media/static/js/request_track_widget/request_widget.js"></script>
  <script>
    (function() {
      const dictionary = {
        'Заказать': 'Замовити',
        'Заказ песни': 'Замовлення пісні',
        'Исполнитель:': 'Виконавець:',
        'Название:': 'Назва:',
        'Представьтесь:': 'Ваше ім’я / Нік:',
        'Сообщение в эфир:': 'Повідомлення в ефір:',
        'Отправить': 'Надіслати',
        'Отмена': 'Скасувати',
        'Поиск': 'Пошук...',
        'Ваша заявка успешно отправлена.': 'Вашу заявку успішно надіслано!',
        'Закрыть': 'Закрити'
      };

      function translateNode(node) {
        if (node.nodeType === Node.TEXT_NODE) {
          let text = node.nodeValue.trim();
          if (dictionary[text]) node.nodeValue = node.nodeValue.replace(text, dictionary[text]);
          if (/Осталось\s+си?м?волов:/i.test(text)) node.nodeValue = node.nodeValue.replace(/Осталось\s+си?м?волов:/gi, 'Залишилося символів:');
        } else if (node.nodeType === Node.ELEMENT_NODE) {
          if (node.tagName === 'INPUT' && node.placeholder) {
            let pText = node.placeholder.trim();
            if (dictionary[pText]) node.placeholder = dictionary[pText];
          }
          node.childNodes.forEach(translateNode);
        }
      }

      const observer = new MutationObserver((mutations) => {
        mutations.forEach((mutation) => mutation.addedNodes.forEach(translateNode));
        document.querySelectorAll('.sc-track-request-widget *').forEach(translateNode);
      });

      window.addEventListener('DOMContentLoaded', () => {
        const target = document.querySelector('.sc-track-request-widget');
        if (target) observer.observe(target, { childList: true, subtree: true, characterData: true });
      });
    })();
  </script>
</body>
</html>
